# Home Assistant scripts for JVC LT-40E71(A) via Broadlink RM4 Mini.
#
# Codes are Strong RCU-Z400N (NEC, address 0xA0) which was identified
# via the jvc_bruteforce.py sweep and single-handedly drives this
# Vestel-chassis DSG-JVC 2016 TV.
#
# This file uses the LIST form (entries start with `- id:`), which is
# what UI-created scripts use and what HA's schema validator expects
# when scripts.yaml already contains UI-managed scripts. If your
# scripts.yaml is entirely in DICT form instead (bare ids as keys),
# convert these three entries accordingly by dropping the leading `-`,
# removing the `id:` line, and promoting the id to the parent key.
#
# Replace `remote.rm4_mini` with the actual entity_id of your
# Broadlink device (Settings -> Devices & services -> Broadlink ->
# Entities).
#
# Regenerate any b64 string with:
#   ./jvc_bruteforce.py --remote Strong/Strong_RCU-Z400N.ir \
#       --button <Name> --combine --dry-run

- id: tv_power
  alias: "TV: Power"
  icon: mdi:power
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.rm4_mini
      data:
        command: "b64:JgBKAAABEokRERERERERERERETMREREzETMRMxEzETMRMxERETMRERERERERMxEzETMRERERERERMxEzERERERERETMRMxEzEQAEwg0F"

- id: tv_source_up
  alias: "TV: Source list - Up"
  icon: mdi:menu-up
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.rm4_mini
      data:
        command: "b64:JgCSAAABEokRERERERERERERETMREREzETMRMxEzETMRMxERETMRERERETMREREzETMRERERERERMxERETMRERERETMRMxEzEQAvlAABEokRERERERERERERETMREREzETMRMxEzETMRMxERETMREREzEREREREzETMREREzEREREREzETMRERERETMREREzEQAEwg0F"

- id: tv_source_down
  alias: "TV: Source list - Down"
  icon: mdi:menu-down
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.rm4_mini
      data:
        command: "b64:JgCSAAABEokRERERERERERERETMREREzETMRMxEzETMRMxERETMRERERETMREREzETMRERERERERMxERETMRERERETMRMxEzEQAvlAABEokRERERERERERERETMREREzETMRMxEzETMRMxERETMREREzERERERERETMREREzEREREREzETMRMxERETMREREzEQAEwg0F"
